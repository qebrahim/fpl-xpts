# Example squad file. Copy to config/squad.toml (git-ignored) and edit.
# name is matched against FPL's web_name / second_name; team is the 3-letter code; pos is GK/DEF/MID/FWD.

# players the FPL news flag still lists as doubtful, but you expect to be fully fit.
# (top-level keys must come BEFORE the first [[players]] table, or TOML attaches them to it)
assume_fit = ["Calafiori", "Thomas"]

