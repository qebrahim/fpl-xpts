# override the minutes model (mf = share of 90 played, app = appearance points, p60 = P(>=60 min))
[overrides.Calafiori]
mf = 0.95
app = 1.9
p60 = 0.9
[overrides.Thomas]
mf = 0.94
app = 1.9
p60 = 0.88
[overrides.Isak]          # returning from injury: ~88% of minutes
mf = 0.88
app = 1.85
p60 = 0.85

