# Default model hyper-parameters and calibration factors.
# Hyper-parameters were chosen by walk-forward backtest over GW1-10 of 2026/27 (see docs/BACKTEST.md).
# Calibration factors = (sum actual + k) / (sum predicted + k) points per position and component over the
# walk-forward backtest rows, i.e. the actual/predicted ratio shrunk towards 1 with k = 160 pseudo-points
# (backtest.CAL_K; k chosen by walk-forward out-of-sample backtest, see docs/BACKTEST.md). Fitted 2026-11 on
# data through GW10 of 2026/27 with the current default model (after dc_opp_k = 40, team_sos_iters = 20 and the
# minutes model skipping injury absences). Refit as the season progresses:  fplxpts backtest --fit

[model]
team_halflife = 3.0          # recency half-life (games) for team attack/defence ratings
team_shrink_k = 3.0          # pseudo-games shrinking team ratings towards league average
team_sos_iters = 20          # strength-of-schedule passes: divide xG by opponent rating (fixed point); 0 = off
form_halflife = 4.0          # recency half-life (games) for player rates; set to 0 for season-long
prior_min = 450.0            # pseudo-minutes of the position-average prior
prior_apps = 3.0             # pseudo-appearances for the defensive-contribution hit rate prior
prior_lambda = 0.15          # weight of last-season rates (fraction of last-season minutes, capped)
prior_cap_minutes = 2500.0
prior_min_season_minutes = 450.0   # ignore a past season with fewer minutes than this
min_live_minutes = 90.0      # players need this many minutes before they are projected
pen_xg = 0.76                # xG value of one penalty
pen_share_xg = 0.10          # normal forward-looking penalty xG per team game, given to the primary taker
opp_xg_gamma = 1.0           # exponent on the opponent-xG matchup (att_opp*dfn_team) for clean sheets; <1 damps it
dc_opp_k = 40.0              # opponent 'DC allowed' factor shrinkage (expected hits); 0 = off. See docs/BACKTEST.md
absence_starts_before = 2    # minutes model skips a run of 0-minute games (inferred injury/suspension) when the player
absence_starts_after = 1     # started his last 2 played games before it and his first game back; 0 = off
odds_weight = 0.5            # bookmaker odds: blend weight of odds-implied team goals in fixtures with odds (next GW); 0 = off
odds_side = "both"           # which side the odds anchor: "both", "attack" (goals/assists), "defence" (cs/gc/saves)
odds_ratings_weight = 0.0    # odds as this many extra games in team ratings (helps GW+2..5 too); 0 = off. See docs/BACKTEST.md

[model.prior_seasons]        # which past seasons feed the prior, and their weight
"2025/26" = 1.0
"2024/25" = 0.5

[calibration.GK]
app = 0.937
cs = 1.135
gc = 0.865
bonus = 0.862
sav = 0.668
yc = 0.963

